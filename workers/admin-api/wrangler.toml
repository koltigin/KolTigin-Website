name = "koltigin-admin-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
# Dashboard-managed runtime variables/secrets must survive Git-triggered deploys.
keep_vars = true

# Public/config identifiers only. Never put GITHUB_TOKEN here.
[vars]
GITHUB_OWNER = "koltigin"
GITHUB_REPO = "KolTigin-Website"
GITHUB_BRANCH = "main"
# ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
# ACCESS_AUD = "your-access-application-audience-tag"
# ACCESS_EMAILS = "owner@example.com"

# Create with: wrangler secret put GITHUB_TOKEN
# Optional extra lock: wrangler secret put ACCESS_EMAILS
