name: Generate share pages

on:
  push:
    branches: [main]
    paths:
      - "content/**/*.md"
      - "content/articles/**"
      - "content/notes/**"
      - "content/social/**"
      - "content/index.json"
      - "content/guides/**"
      - "writings/**"
      - "config/writing-types.json"
      - "index.html"
      - "config/site.json"
      - "assets/images/blog/**"
      - "assets/images/guides/**"
      - "assets/images/profile/koltigin-at.png"
      - "assets/images/og/backgrounds/**"
      - "assets/fonts/**"
      - "scripts/generate-share.py"
      - "scripts/requirements-share.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-share
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install -r scripts/requirements-share.txt

      - name: Generate share pages, OG images, and sitemap
        run: python3 scripts/generate-share.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git add about/index.html resume/index.html projects/index.html writings/index.html videos/index.html contact/index.html 2>/dev/null || true
          git add writings guides 2>/dev/null || true
          git add -u -- guide 2>/dev/null || true
          git add content/og-versions.json 2>/dev/null || true
          if [ -d assets/images/og ]; then git add assets/images/og; fi
          if git diff --cached --quiet; then
            echo "Share artifacts are already up to date."
            exit 0
          fi
          git commit -m "Regenerate Writing and Guide social-preview pages"
          git push
